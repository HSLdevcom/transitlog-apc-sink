plugins {
    id 'com.gradleup.shadow' version '9.1.0'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'application'
    id 'com.diffplug.spotless' version '7.2.1'
    id 'jacoco'
}

group = 'fi.hsl.transitlog'
version = '2.0.0'

repositories {
    mavenCentral()
    maven {
        url "https://maven.pkg.github.com/HSLdevcom/*"
        credentials {
            username = project.findProperty("github.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("github.token") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

spotless {
    kotlin {
        ktfmt('0.55').kotlinlangStyle()
    }

    kotlinGradle {
        ktfmt('0.55').kotlinlangStyle()
    }
}

tasks.named("shadowJar") {
    archiveFileName.set("transitlog-apc-sink.jar")
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'

    testImplementation "org.testcontainers:testcontainers:1.17.6"
    testImplementation "org.testcontainers:junit-jupiter:1.17.6"

    testImplementation "org.mockito.kotlin:mockito-kotlin:6.3.0"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    implementation "io.github.microutils:kotlin-logging:1.6.22"

    implementation ('fi.hsl:transitdata-common:2.0.4') {
        exclude group: 'javax.xml.bind', module: 'activation'
    }
    //Needed for Pulsar
    implementation 'jaxb:activation:1.0.2'

    implementation 'org.postgresql:postgresql:42.3.4'
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}

kotlin {
    jvmToolchain(25)
}

compileKotlin {
    kotlinOptions.jvmTarget = "25"
}

compileTestKotlin {
    kotlinOptions.jvmTarget = "25"
}

application {
    mainClass = 'fi.hsl.transitlog.MainKt'
}
