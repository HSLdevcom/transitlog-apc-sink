name: CI/CD

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  merge_group:

jobs:
  ci-cd:
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-kotlin.yml@7d7ce3792154049042bf37ad2b00739a1d3bfbfe # main
    secrets: inherit # zizmor: ignore[secrets-inherit] Shared workflow does not declare named secrets.
    with:
      performRelease: ${{ github.ref == 'refs/heads/main' }}
      runTestsInsideDocker: false

  publish-edge:
    name: Publish edge Docker tag
    needs: ci-cd
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: docker-hub-release
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_INFODEVOPS_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_INFODEVOPS_TOKEN }}
      - name: Tag the main image as edge
        run: docker buildx imagetools create --tag hsldevcom/transitlog-apc-sink:edge hsldevcom/transitlog-apc-sink:main
